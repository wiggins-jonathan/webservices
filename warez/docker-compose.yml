x-env : &env
  TZ: America/Phoenix
  PUID: 1000
  PGID: 100

x-time: &time /etc/localtime:/etc/localtime:ro

x-restart: &restart
  restart: unless-stopped

services:
  jellyfin:
    image: linuxserver/jellyfin:10.11.11
    container_name: jellyfin
    ports: ["8096:8096"]
    environment:
      <<: *env
      # https://docs.linuxserver.io/images/docker-jellyfin/#intel
      DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - ./jellyfin/config:/config
      - /mnt/data/media:/media
    devices: ["/dev/dri:/dev/dri"]  # intel quicksync hardware acceleration
    <<: *restart

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    devices: [/dev/net/tun:/dev/net/tun]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    ports: ["9092:9092/tcp"] # qbittorrent
    environment:
      <<: *env
      VPN_SERVICE_PROVIDER: airvpn
      VPN_TYPE: wireguard
      WIREGUARD_ADDRESSES: 10.188.142.147/32
      FIREWALL_VPN_INPUT_PORTS: 39707
      SERVER_CITIES: Phoenix Arizona
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY}
      # Automatically update qBittorrent if VPN loses connection
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c
        'wget -O-
        --retry-connrefused
        --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:9092/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c
        'wget -O-
        --retry-connrefused
        --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:9092/api/v2/app/setPreferences'
    <<: *restart

  qbittorrent:
    image: linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    security_opt: [no-new-privileges:true]
    depends_on: [gluetun]
    network_mode: service:gluetun
    environment:
      <<: *env
      WEBUI_PORT: 9092
      TORRENTING_PORT: 39707
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ./qbittorrent:/config
      - /mnt/data/torrents:/data/torrents
    <<: *restart

  deluge:
    image: linuxserver/deluge:2.2.0-ls381
    container_name: deluge
    ports:
      - "8112:8112"   # web ui
      - "6881:6881"
      - "6881:6881/udp"
      - "58846:58846" # thin client
    environment:
      <<: *env
    volumes:
      - ./deluge/config:/config
      - /mnt/data/torrents:/data/torrents
    <<: *restart

  radarr: # movies
    image: linuxserver/radarr:6.3.0.10514-ls311
    container_name: radarr
    ports: ["7878:7878"]
    environment:
      <<: *env
    volumes:
      - ./radarr:/config
      - /mnt/data:/data
    <<: *restart

  sonarr: # tv
    image: linuxserver/sonarr:4.0.19.2979-ls320
    container_name: sonarr
    ports: ["8989:8989"]
    environment:
      <<: *env
    volumes:
      - ./sonarr:/config
      - /mnt/data:/data
    <<: *restart

  prowlarr: # indexers
    image: linuxserver/prowlarr:2.5.2.5491-ls155
    container_name: prowlarr
    ports: ["9696:9696"]
    environment:
      <<: *env
    volumes:
      - ./prowlarr:/config
    <<: *restart

  seerr:  # watch requests
    image: seerr/seerr:preview-new-oidc
    container_name: seerr
    ports: ["5055:5055"]
    environment:
      <<: *env
    volumes:
      - ./seerr:/app/config
    <<: *restart

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    container_name: audiobookshelf
    ports: ["13378:80"]
    environment:
      <<: *env
    volumes:
      - /mnt/data/media/books:/audiobooks
      - /mnt/data/media/podcasts:/podcasts
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
    <<: *restart

  audiobookrequest:
    image: markbeep/audiobookrequest:1.10.6
    container_name: audiobookrequest
    ports: ["13379:8000"]
    environment:
      <<: *env
      ABR_APP__INIT_ROOT_USERNAME: admin
      ABR_APP__INIT_ROOT_PASSWORD: ${audiobookrequest_password}
    volumes:
      - ./audiobookrequest:/config
    <<: *restart

  profilarr:  # video quality config
    image: ghcr.io/dictionarry-hub/profilarr:2.0.9
    container_name: profilarr
    depends_on: [sonarr, radarr]
    ports: ["6868:6868"]
    environment:
      <<: *env
      AUTH: off
    volumes:
      - ./profilarr:/config
    <<: *restart
