x-env : &env
  TZ: America/Phoenix
  PUID: 1000
  PGID: 100

x-time: &time /etc/localtime:/etc/localtime:ro

x-restart: &restart
  restart: unless-stopped

services:
  jellyfin:
    image: linuxserver/jellyfin:10.10.7
    container_name: jellyfin
    ports: ["8096:8096"]
    environment:
      <<: *env
    volumes:
      - ./jellyfin/config:/config
      - /mnt/data/media:/media
    devices: ["/dev/dri:/dev/dri"]  # intel quicksync hardware acceleration
    <<: *restart

  deluge:
    image: linuxserver/deluge:2.2.0-r0-ls332
    container_name: deluge
    ports:
      - "8112:8112"   # web ui
      - "6881:6881"
      - "6881:6881/udp"
      - "58846:58846" # thin client
    environment:
      <<: *env
    volumes:
      - ./deluge/config:/config
      - /mnt/data/torrents:/data/torrents
    <<: *restart

  radarr: # movies
    image: linuxserver/radarr:5.26.2.10099-ls276
    container_name: radarr
    ports: ["7878:7878"]
    environment:
      <<: *env
    volumes:
      - ./radarr:/config
      - /mnt/data:/data
    <<: *restart

  sonarr: # tv
    image: linuxserver/sonarr:4.0.15.2941-ls286
    container_name: sonarr
    ports: ["8989:8989"]
    environment:
      <<: *env
    volumes:
      - ./sonarr:/config
      - /mnt/data:/data
    <<: *restart

  prowlarr: # indexers
    image: linuxserver/prowlarr:1.37.0.5076-ls120
    container_name: prowlarr
    ports: ["9696:9696"]
    environment:
      <<: *env
    volumes:
      - ./prowlarr:/config
    <<: *restart

  jellyseer:  # requests
    image: fallenbagel/jellyseerr:preview-OIDC
    container_name: jellyseer
    ports: ["5055:5055"]
    environment:
      <<: *env
    volumes:
      - ./jellyseer:/app/config
    <<: *restart
