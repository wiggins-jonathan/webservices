services:
  conduit:
    image: matrixconduit/matrix-conduit:v0.8.0
    container_name: conduit
    ports: ["8448:6167"]  # published port 8448 can't be changed because of federation
    environment:
        CONDUIT_CONFIG: ''  # Allows config via these environment variables

        # even though conduit is served on matrix.${DOMAIN}, we use the
        # .well-known delegation to set users/rooms here to just ${DOMAIN}
        CONDUIT_SERVER_NAME: ${DOMAIN}

        CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit/
        CONDUIT_DATABASE_BACKEND: rocksdb
        CONDUIT_ADDRESS: 0.0.0.0
        CONDUIT_PORT: 6167
        CONDUIT_MAX_REQUEST_SIZE: 20000000 # in bytes, ~20 MB
        CONDUIT_ALLOW_REGISTRATION: 'true'
        CONDUIT_ALLOW_FEDERATION: 'true'
        CONDUIT_ALLOW_CHECK_FOR_UPDATES: 'false'
        CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
        CONDUIT_ENABLE_LIGHTNING_BOLT: 'false'
    volumes:
      - ./data:/var/lib/matrix-conduit/
    restart: unless-stopped

  instagram-bridge:
    image: dock.mau.dev/mautrix/meta:v0.3.2
    container_name: instagram-bridge
    volumes:
      - ./bridges/instagram:/data
    restart: unless-stopped
