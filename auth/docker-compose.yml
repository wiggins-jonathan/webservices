services:
  lldap:
    image: lldap/lldap:v0.6.3-alpine
    container_name: lldap
    environment:
      UID: ${PUID}
      GID: ${PGID}
      TZ: ${TZ}
      LLDAP_HTTP_URL: "https://lldap.${DOMAIN}"
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET}
      LLDAP_LDAP_USER_PASS: ${LLDAP_USER_PASS}
      LLDAP_LDAP_BASE_DN: ${BASE_DN}
      LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: true
      LLDAP_SMTP_OPTIONS__SERVER: smtp.purelymail.com
      LLDAP_SMTP_OPTIONS__PORT: 465
      LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION: TLS
      LLDAP_SMTP_OPTIONS__USER: noreply@${DOMAIN}
      LLDAP_SMTP_OPTIONS__PASSWORD: ${SMTP_APP_PASSWORD}
      LLDAP_SMTP_OPTIONS__FROM: Do Not Reply <noreply@${DOMAIN}>
      LLDAP_SMTP_OPTIONS__REPLY_TO: Do Not Reply <noreply@localhost>
    ports:
      - "3890:3890"   # ldap
      - "17170:17170" # web UI
    volumes:
      - ./lldap:/data
    restart: unless-stopped

  authelia:
    image: authelia/authelia:4.39.20
    container_name: authelia
    depends_on: [lldap]
    environment:
      DOMAIN: ${DOMAIN}
      PUID: ${PUID}
      PGID: ${PGID}
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${LLDAP_USER_PASS}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_BASE_DN: ${BASE_DN}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER: uid=admin,ou=people,${BASE_DN}
      AUTHELIA_NOTIFIER_SMTP_PASSWORD: ${SMTP_APP_PASSWORD}
    ports: ["1000:1000"]
    volumes:
      - ./authelia:/config
    restart: unless-stopped

  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2.13.0
    container_name: pocketid
    depends_on: [lldap]
    ports: ["1411:1411"]
    environment:
      ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY}
      APP_URL: "https://auth.${DOMAIN}"
      TRUST_PROXY: true
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      ANALYTICS_DISABLED: 'true'
      UI_CONFIG_DISABLED: 'true'  # required for the following env vars
      APP_NAME: ${DOMAIN}
      SESSION_DURATION: 480 # 8 hours
      LDAP_ENABLED: 'true'
      LDAP_URL: 'ldap://lldap:3890'
      LDAP_BIND_DN: 'uid=admin,ou=people,dc=wiggins,dc=tech'
      LDAP_BIND_PASSWORD: ${LLDAP_USER_PASS}
      LDAP_BASE: ${BASE_DN}
      LDAP_ATTRIBUTE_USER_UNIQUE_IDENTIFIER: uuid
      LDAP_ATTRIBUTE_USER_USERNAME: uid
      LDAP_ATTRIBUTE_USER_EMAIL: mail
      LDAP_ATTRIBUTE_USER_FIRST_NAME: givenName
      LDAP_ATTRIBUTE_USER_LAST_NAME: sn
      LDAP_ATTRIBUTE_USER_PROFILE_PICTURE: jpegPhoto
      LDAP_ATTRIBUTE_GROUP_UNIQUE_IDENTIFIER: uuid
      LDAP_ATTRIBUTE_GROUP_NAME: cn
      LDAP_ADMIN_GROUP_NAME: pocketid_admin_group
      ALLOW_DOWNGRADE: 'false'
    volumes:
      - "./pocketid:/app/data"
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    restart: unless-stopped
